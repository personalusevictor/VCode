<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f0f1ed" />
    <meta
      name="description"
      content="VCode: una biblioteca de programación en construcción. Explora siete lenguajes y descubre un espacio para aprender, consultar y crear."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>VCode — El código, en tus manos</title>
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("vcode-theme");
        } catch {}
        document.documentElement.dataset.theme =
          theme === "dark" || theme === "light"
            ? theme
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
