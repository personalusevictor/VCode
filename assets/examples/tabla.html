<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comparar información en una tabla</title>
    <link rel="stylesheet" href="../css/examples-preview.css">
  </head>
  <body>
    <table>
      <caption>Elementos para empezar</caption>
      <thead>
        <tr>
          <th scope="col">Elemento</th>
          <th scope="col">Para qué sirve</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>h1</td><td>Título principal</td></tr>
        <tr><td>p</td><td>Párrafo de texto</td></tr>
        <tr><td>a</td><td>Enlace a un destino</td></tr>
      </tbody>
    </table>
  </body>
å</html>
